name: MERN Chat CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    
    # Server Build
    - name: Install Server Dependencies
      run: |
        cd server
        npm install
    
    - name: Build Server
      run: |
        cd server
        npm run build

    # Client Build
    - name: Install Client Dependencies
      run: |
        cd client
        npm install

    - name: Build Client
      run: |
        cd client
        npm run build
